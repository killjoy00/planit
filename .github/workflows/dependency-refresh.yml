name: Dependency lock refresh

on:
  push:
    branches:
      - codex/dependency-security-cleanup

permissions:
  contents: read

concurrency:
  group: dependency-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dependency-security-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve dependencies and apply non-breaking audit fixes
        run: |
          find emails lib -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 sed -i 's|"@react-email/components"|"react-email"|g; s|"@react-email/render"|"react-email"|g'
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
          mkdir -p generated
          npm audit --json > generated/audit-full.json || true
          npm audit --omit=dev --json > generated/audit-prod.json || true
          cp package-lock.json generated/package-lock.json
          git diff --name-only -- emails lib | while IFS= read -r file; do
            mkdir -p "generated/$(dirname "$file")"
            cp "$file" "generated/$file"
          done
      - name: Upload generated cleanup files
        uses: actions/upload-artifact@v4
        with:
          name: dependency-cleanup-generated
          path: generated
