name: Dependency lock refresh

on:
  push:
    branches:
      - codex/dependency-security-cleanup

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dependency-security-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Migrate React Email imports and refresh lockfile
        run: |
          find emails lib -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 sed -i 's|"@react-email/components"|"react-email"|g; s|"@react-email/render"|"react-email"|g'
          npm install --package-lock-only --ignore-scripts
          npm audit --json > dependency-audit.json || true
      - name: Upload dependency audit
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit.json
      - name: Commit generated dependency changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json emails lib
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh dependency lockfile and React Email imports [skip ci]"
          git push origin HEAD:codex/dependency-security-cleanup
