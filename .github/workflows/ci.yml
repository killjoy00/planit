name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: planit
          POSTGRES_PASSWORD: planit
          POSTGRES_DB: planit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planit -d planit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://planit:planit@127.0.0.1:5432/planit
      AUTH_SECRET: ci-only-secret
      RESEND_API_KEY: re_ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run ci
